# Datasets do Roboflow Universe usados no projeto.
#
# Como preencher: abra o dataset em https://universe.roboflow.com, clique em
# "Download Dataset" > "Show download code" e copie workspace, project e version.
# Prefira versões SEM augmentation (ou com o mínimo possível): a augmentation é
# feita no treino, e cópias aumentadas do Roboflow inflam as métricas se caírem
# em splits diferentes (o preparar.py agrupa por imagem original para evitar isso).
#
# formato:
#   yolov8  -> dataset de detecção (caixas); o preparar.py recorta cada nota
#   folder  -> dataset de classificação (uma pasta por classe)
#
# Todos são CC BY 4.0 (exigem citação: ver README). Conferidos em 2026-11-26.
# Rótulos de moedas ("1 real", "10 cents", "moeda_...") são descartados pelo preparar.py.

datasets:
  # 2.478 imagens, 7 valores x frente/verso, sem augmentation
  - workspace: anagirelli-alunos-utfpr-edu-br
    project: reconhecedor-de-cedulas-real
    version: 1
    formato: yolov8
  # 622 imagens, 7 valores x frente/verso + moedas, sem augmentation
  - workspace: gabriel-pereira-aakjt
    project: reconhecimento-de-real
    version: 2
    formato: yolov8
  # 1.694 imagens (~565 originais x3), 7 valores + moedas.
  # Única versão grande tem augmentation (flip horizontal, rotação 90°); as cópias
  # ficam no mesmo split graças ao agrupamento por imagem original.
  - workspace: elainesilva
    project: brazilian-currency
    version: 12
    formato: yolov8
